; Fido robot firmware: ESP32-DevKit-V1 (ESP32-WROOM-32 only; S3/C3 have no Classic Bluetooth A2DP).
[platformio]
default_envs = esp32dev

[env:esp32dev]
; Pinned: platform 6.9.0 = Arduino-ESP32 2.0.17. ESP32-A2DP v1.8.9 needs Arduino-ESP32 3.x
; (btStartMode), so use v1.8.8, the last tag that builds here. It is not in the PlatformIO
; registry, hence the git URL.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
extra_scripts = pre:tools/uploadaudio.py
build_flags =
    -Wall -Wextra
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.8
    bblanchon/ArduinoJson@7.4.3

; Host-side unit tests of the pure safety / audio logic. No hardware, no Arduino.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
lib_deps =
    bblanchon/ArduinoJson@7.4.3
lib_ignore =
    ESP32-A2DP
